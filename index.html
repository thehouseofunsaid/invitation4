<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a1f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gruhapravesam | Balamoni Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* =====================================================
     COLOURS (same for every order)
     ===================================================== */
  :root{
    --maroon:#7a1f2b;
    --text:#5b2a22;
    --gold:#a0701f;
    --gold-light:#e9c877;
    --cream:#f6ecd2;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#1b120c;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
  body{-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;}
  body{font-family:'Cormorant Garamond',serif;color:var(--text);-webkit-tap-highlight-color:transparent;}

  /* Phone-sized frame (on laptop it stays phone width) */
  .app{
    position:relative;
    width:min(100vw,480px);
    height:100dvh;
    margin:0 auto;
    overflow:hidden;
    background:#f6ecd2;
    container-type:size;
  }

  /* Stage – always shows the full height of every picture */
  .stage{
    position:absolute;
    left:50%;top:50%;
    width:calc(100cqh * 1040 / 1860);
    aspect-ratio:1040 / 1860;
    transform:translate(-50%,-50%);
    container-type:inline-size;
    overflow:hidden;
  }

  /* Screens: soft blur cross-fade (blur fully removed once shown, so photos stay sharp) */
  .screen{
    position:absolute;inset:0;
    opacity:0;visibility:hidden;
    filter:blur(12px);
    transition:opacity 1.2s ease, filter 1.2s ease, visibility 1.2s ease;
  }
  .screen.active{opacity:1;visibility:visible;filter:none;}

  /* Gold dust on top of everything */
  #sparkles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}

  /* =====================================================
     TEXT STYLES – royal wedding look
     ===================================================== */
  .script{font-family:'Great Vibes',cursive;color:var(--maroon);line-height:1.2;}
  .serif {font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--text);line-height:1.35;}
  .italic{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--gold);}
  .caps  {font-family:'Cinzel Decorative',serif;font-weight:700;letter-spacing:.22em;color:var(--gold);}

  /* Gold foil text that shines */
  .gold{
    display:inline-block;
    background:linear-gradient(100deg,
      #7c4a0c 0%, #b8841f 20%, #fff0bd 30%, #c9962f 40%, #7c4a0c 55%,
      #b8841f 70%, #fff0bd 80%, #c9962f 90%, #7c4a0c 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    padding:0 2cqi;
    animation:shine 3s linear infinite;
  }
  @keyframes shine{to{background-position:-200% 0;}}

  /* small gold ornament line */
  .orn{
    width:30cqi;height:2cqi;margin:1.2cqi auto;
    background:
      radial-gradient(circle,var(--gold) 0 .55cqi,transparent .65cqi) center/2cqi 2cqi no-repeat,
      linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold) 42%,transparent 45%,transparent 55%,var(--gold) 58%,var(--gold) 75%,transparent) center/100% 1px no-repeat;
  }

  /* =====================================================
     REVEAL EFFECTS (one by one – nothing shows before its turn)
     ===================================================== */
  .ln{opacity:0;}

  /* cursive lines: written letter by letter, like a pen */
  .ln.write{opacity:0;}
  .ln.write.on{opacity:1;}
  .ln.write .ch{opacity:0;display:inline-block;white-space:pre;}
  .ln.on.write .ch{animation:penIn .6s ease-out forwards;}
  .gold .ch{padding:0 .2em;margin:0 -.2em;background:inherit;background-size:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;}
  @keyframes penIn{
    0%  {opacity:0;clip-path:inset(-40% 100% -40% -40%);transform:translateY(.5cqi) scale(.9);filter:blur(2px);}
    100%{opacity:1;clip-path:inset(-40% -40% -40% -40%);transform:none;filter:blur(0);}
  }

  .ln.letters{opacity:0;}
  .ln.letters.on{opacity:1;}
  .ln.letters .ch{opacity:0;display:inline-block;white-space:pre;}
  .ln.on.letters .ch{animation:chIn .55s ease forwards;}
  @keyframes chIn{
    0%  {opacity:0;filter:blur(4px);transform:translateY(.6cqi);}
    100%{opacity:1;filter:blur(0);transform:translateY(0);}
  }

  .ln.on.fade{animation:fadeUp .9s ease forwards;}
  @keyframes fadeUp{
    0%  {opacity:0;filter:blur(6px);transform:translateY(2cqi);}
    100%{opacity:1;filter:blur(0);transform:translateY(0);}
  }

  .ln.on.pop{animation:pop 1.2s cubic-bezier(.2,.9,.3,1.2) forwards;}
  @keyframes pop{
    0%  {opacity:0;transform:scale(.7);filter:blur(8px);}
    100%{opacity:1;transform:scale(1);filter:blur(0);}
  }

  /* cards fly in, crossing from left and right */
  .ln.on.fromL{animation:flyL 1s cubic-bezier(.2,.8,.25,1.1) forwards;}
  .ln.on.fromR{animation:flyR 1s cubic-bezier(.2,.8,.25,1.1) forwards;}
  @keyframes flyL{
    0%  {opacity:0;transform:translate(-60cqi,8cqi) rotate(-14deg) scale(.7);}
    100%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}
  }
  @keyframes flyR{
    0%  {opacity:0;transform:translate(60cqi,8cqi) rotate(14deg) scale(.7);}
    100%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}
  }

  /* shared moving keyframes */
  @keyframes sweep{0%{left:-60%;}60%,100%{left:140%;}}
  @keyframes haloPulse{0%,100%{opacity:.5;transform:scale(.96);}50%{opacity:1;transform:scale(1.04);}}
  @keyframes leafSway {0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
  @keyframes leafSwayR{0%,100%{transform:rotate(2.5deg);}50%{transform:rotate(-2.5deg);}}
  @keyframes plantSway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes lotusSway{0%,100%{transform:rotate(-3.5deg);}50%{transform:rotate(3.5deg);}}
  @keyframes flicker{from{transform:scale(1,1);}to{transform:scale(.88,1.12);}}

  /* slow zoom in & out on every picture */
  .screen.active .s1art,.screen.active .s2art,.screen.active .s3art,.screen.active .s4art{animation:kenburns 12s ease-in-out infinite alternate;}
  @keyframes kenburns{0%{transform:translateX(-50%) scale(1);}100%{transform:translateX(-50%) scale(1.08);}}
  .screen.active .s2-lotus .photo img{animation:eldersZoom 7s ease-in-out infinite alternate;}
  @keyframes eldersZoom{0%{transform:scale(1.12);}100%{transform:scale(1.28);}}

  /* =====================================================
     MUSIC BUTTON (top right)
     ===================================================== */
  .music-btn{
    position:absolute;z-index:70;
    top:calc(env(safe-area-inset-top, 0px) + 22px);right:12px;
    width:34px;height:34px;border-radius:50%;
    border:1.2px solid var(--gold);
    background:rgba(255,250,240,.75);
    color:var(--maroon);font-size:15px;line-height:31px;text-align:center;
    cursor:pointer;
  }
  .music-btn.playing{animation:spinSlow 6s linear infinite;}
  .music-btn.off::after{
    content:"";position:absolute;left:7px;right:7px;top:50%;
    height:1.2px;background:var(--maroon);transform:rotate(-45deg);
  }
  @keyframes spinSlow{to{transform:rotate(360deg);}}

  /* =====================================================
     SCREEN 1 – GANESHA
     ===================================================== */
  .s1-text{position:absolute;left:12%;right:12%;top:39%;text-align:center;}

  .s1art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:736 / 1308;transform:translateX(-50%);}
  .s1art img{position:absolute;display:block;}
  .s1art .full{inset:0;width:100%;height:100%;}
  .s1art .lampL{left:6.386%;top:35.703%;width:10.870%;transform-origin:50% 0%;animation:swing 3s ease-in-out infinite;}
  .s1art .lampR{left:83.560%;top:34.557%;width:11.549%;transform-origin:50% 0%;animation:swing 3.3s ease-in-out infinite -1s;}
  .s1art .cowR{left:71.060%;top:68.960%;width:19.293%;transform-origin:50% 95%;animation:cowWalk 1.8s ease-in-out infinite;}
  .s1art .peacock{left:10.190%;top:67.202%;width:23.641%;transform-origin:45% 95%;animation:peaDance 2.6s ease-in-out infinite;}
  .s1art .cows{left:25.408%;top:83.104%;width:22.826%;transform-origin:50% 100%;}   /* cows beside the couple stay still */
  .s1art .lotusL1{left:1.359%;top:76.988%;width:11.549%;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite;}
  .s1art .lotusL2{left:3.804%;top:85.780%;width:19.701%;transform-origin:50% 100%;animation:sway 3.8s ease-in-out infinite -1s;}
  .s1art .lotusR1{left:84.918%;top:73.930%;width:14.674%;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite -.6s;}
  .s1art .lotusR2{left:81.929%;top:83.180%;width:17.663%;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite -1.6s;}
  .s1art .lotusR3{left:67.935%;top:88.456%;width:15.217%;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite -.3s;}
  @keyframes sway      {0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  @keyframes swing     {0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  @keyframes peaDance  {0%,100%{transform:rotate(-2deg) translateY(0);}50%{transform:rotate(2.5deg) translateY(-3%);}}
  @keyframes cowWalk   {0%,100%{transform:translateX(0) rotate(-3deg);}25%{transform:translateX(-4%) translateY(-4%) rotate(0deg);}50%{transform:translateX(-8%) rotate(3deg);}75%{transform:translateX(-4%) translateY(-4%) rotate(0deg);}}

  .s1art .glow{
    position:absolute;left:50.3%;top:11.5%;width:46%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(255,236,170,.75) 0%, rgba(255,214,120,.35) 35%, rgba(255,214,120,0) 70%);
    mix-blend-mode:screen;animation:glowPulse 2.8s ease-in-out infinite;pointer-events:none;
  }
  @keyframes glowPulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9);}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08);}}

  .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .petal{position:absolute;top:-4%;width:2.4cqi;height:1.8cqi;border-radius:70% 0 70% 0;opacity:0;animation:fall linear infinite;}
  @keyframes fall{
    0%  {transform:translate(0,0) rotate(0deg);opacity:0;}
    8%  {opacity:.95;}
    100%{transform:translate(10cqi,185cqi) rotate(560deg);opacity:0;}
  }
  .s1-mantra{font-size:3cqi;}
  .s1-welcome{font-size:6cqi;margin-top:2.4cqi;white-space:nowrap;}
  .s1-names{font-family:'Great Vibes',cursive;font-size:10.5cqi;line-height:1.15;}
  .s1-event{font-size:2.7cqi;letter-spacing:.3em;color:var(--maroon);margin-top:.6cqi;}

  /* =====================================================
     SCREEN 2 – BLESSINGS (moving cows + elders in a blooming lotus)
     ===================================================== */
  .s2art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:893 / 1586;transform:translateX(-50%);}
  .s2art img{position:absolute;display:block;}
  .s2art .full{inset:0;width:100%;height:100%;}
  .s2art .leavesTL{left:0.000%;top:0.000%;width:24.860%;transform-origin:0% 0%;animation:leafSway 4s ease-in-out infinite;}
  .s2art .branchL{left:0.000%;top:14.565%;width:16.797%;transform-origin:0% 0%;animation:leafSway 3.4s ease-in-out infinite -1s;}
  .s2art .leavesTR{left:86.114%;top:0.000%;width:13.886%;transform-origin:100% 0%;animation:leafSwayR 4.2s ease-in-out infinite -.5s;}
  .s2art .branchR{left:77.044%;top:26.293%;width:22.956%;transform-origin:100% 0%;animation:leafSwayR 3.6s ease-in-out infinite -1.4s;}
  .s2art .plantR{left:72.228%;top:66.393%;width:24.636%;transform-origin:50% 100%;animation:plantSway 3.2s ease-in-out infinite;}
  .s2art .cowsL{left:13.774%;top:73.834%;width:33.483%;transform-origin:50% 100%;animation:cowBob 2.2s ease-in-out infinite;}
  .s2art .cowsR{left:54.983%;top:72.194%;width:39.866%;transform-origin:50% 100%;animation:cowBob 2.6s ease-in-out infinite -.8s;}
  .s2art .front{left:11.534%;top:81.148%;width:85.554%;}
  @keyframes cowBob{0%,100%{transform:rotate(-1deg) translateY(0);}50%{transform:rotate(1deg) translateY(-1.2%);}}

  .s2-head{position:absolute;left:0;right:0;top:6.5%;text-align:center;}
  .s2-script{font-size:7.4cqi;white-space:nowrap;}
  .s2-small{font-size:2.4cqi;letter-spacing:.3em;margin-top:.6cqi;color:var(--maroon);}

  /* elders photo – inside a blooming lotus */
  .s2-lotus{position:absolute;left:50%;top:16%;width:70cqi;aspect-ratio:1;margin-left:-35cqi;}
  .s2-lotus .glow2{
    position:absolute;inset:-6%;border-radius:50%;
    background:radial-gradient(circle, rgba(255,226,150,.9) 0%, rgba(255,226,150,.35) 40%, rgba(255,226,150,0) 68%);
    animation:haloPulse 3s ease-in-out infinite;
  }
  .s2-lotus .rays{
    position:absolute;inset:-12%;border-radius:50%;
    background:repeating-conic-gradient(rgba(233,180,70,.45) 0 2deg, transparent 2deg 9deg);
    -webkit-mask:radial-gradient(circle, transparent 38%, #000 44%, transparent 70%);
            mask:radial-gradient(circle, transparent 38%, #000 44%, transparent 70%);
    animation:spinSlow 50s linear infinite;
  }
  .s2-lotus svg.petals2{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:lotusBreath 5s ease-in-out infinite 4s;}
  @keyframes lotusBreath{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.025) rotate(1.5deg);}}
  .s2-lotus .pt{transform-origin:0 0;transform:scale(.15,.05);opacity:0;}
  #screen2.go .s2-lotus .pt{animation:petalOpen 1.6s cubic-bezier(.25,.8,.3,1.15) forwards;}
  @keyframes petalOpen{0%{transform:scale(.15,.05);opacity:0;}30%{opacity:1;}100%{transform:scale(1,1);opacity:1;}}
  .s2-lotus .photo{
    position:absolute;left:27%;top:27%;width:46%;height:46%;
    border-radius:50%;padding:1.1cqi;
    background:linear-gradient(135deg,#8a5a12,#e9c877 25%,#fff3c4 40%,#c9962f 55%,#8a5a12 75%,#e9c877);
    box-shadow:0 0 0 .6cqi rgba(255,248,225,.85), 0 1.5cqi 5cqi rgba(120,30,50,.35);
    transform:scale(0);
  }
  #screen2.go .s2-lotus .photo{animation:photoRise 1.2s cubic-bezier(.2,.9,.3,1.2) forwards var(--pd,2.4s);}
  @keyframes photoRise{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0);}}
  .s2-lotus .photo .in{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;border:.5cqi solid #fff5dc;}
  .s2-lotus .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;transform:scale(1.15);}
  .s2-lotus .photo .in::after{
    content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,245,215,.65),transparent);
    transform:skewX(-18deg);animation:sweep 4.5s ease-in-out infinite 4s;
  }

  /* names on a narrow maroon ribbon (does not touch the pavilion) */
  .s2-ribbon{
    position:absolute;left:27%;right:27%;top:56%;text-align:center;
    padding:1.4cqi 1.5cqi 1.6cqi;
    background:linear-gradient(135deg,#962f3b,var(--maroon) 50%,#5a1420);
    border:1px solid var(--gold-light);border-radius:1.6cqi;
    box-shadow:0 0 0 .6cqi rgba(255,248,225,.7), 0 1.6cqi 4cqi rgba(80,30,10,.3);
  }
  .s2-ribbon::before,.s2-ribbon::after{
    content:"";position:absolute;top:50%;width:6cqi;height:6cqi;margin-top:-3cqi;
    background:linear-gradient(135deg,#7a1f2b,#5a1420);transform:rotate(45deg);z-index:-1;
  }
  .s2-ribbon::before{left:-2cqi;} .s2-ribbon::after{right:-2cqi;}
  .s2-name{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:2.3cqi;letter-spacing:.03em;white-space:nowrap;color:#f7e3a2;}
  .s2-amp{font-family:'Great Vibes',cursive;font-size:4.4cqi;line-height:1;color:#e9c877;}

  /* =====================================================
     SCREEN 3 – PLEASE JOIN US (moving elephant picture)
     ===================================================== */
  .s3art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:941 / 1672;transform:translateX(-50%);}
  .s3art img{position:absolute;display:block;}
  .s3art .full{inset:0;width:100%;height:100%;}
  .s3art .str_178{left:16.366%;top:23.026%;width:5.101%;transform-origin:50% 0%;animation:stringSwing 2.9s ease-in-out infinite -1.1s;}
  .s3art .str_232{left:22.742%;top:23.804%;width:3.826%;transform-origin:50% 0%;animation:stringSwing 3.1s ease-in-out infinite -1.2s;}
  .s3art .str_322{left:31.668%;top:14.354%;width:5.101%;transform-origin:50% 0%;animation:stringSwing 3.5s ease-in-out infinite -0.1s;}
  .s3art .str_378{left:37.620%;top:11.663%;width:5.101%;transform-origin:50% 0%;animation:stringSwing 2.6s ease-in-out infinite -1.7s;}
  .s3art .str_482{left:49.309%;top:11.364%;width:4.463%;transform-origin:50% 0%;animation:stringSwing 3.0s ease-in-out infinite -0.5s;}
  .s3art .str_533{left:54.623%;top:11.842%;width:4.038%;transform-origin:50% 0%;animation:stringSwing 4.0s ease-in-out infinite -0.9s;}
  .s3art .str_633{left:65.462%;top:13.756%;width:4.357%;transform-origin:50% 0%;animation:stringSwing 3.8s ease-in-out infinite -1.0s;}
  .s3art .str_686{left:70.882%;top:16.447%;width:4.570%;transform-origin:50% 0%;animation:stringSwing 3.5s ease-in-out infinite -0.3s;}
  .s3art .str_786{left:81.615%;top:21.651%;width:4.463%;transform-origin:50% 0%;animation:stringSwing 3.5s ease-in-out infinite -1.7s;}
  .s3art .bananaL{left:0.000%;top:10.108%;width:36.344%;transform-origin:5% 100%;animation:bananaSwayL 4s ease-in-out infinite;}
  .s3art .bananaR{left:72.476%;top:0.000%;width:27.524%;transform-origin:100% 25%;animation:leafSwayR 4.4s ease-in-out infinite -1s;}
  .s3art .rosesL{left:0.000%;top:66.926%;width:14.346%;transform-origin:20% 100%;animation:plantSway 3.6s ease-in-out infinite;}
  .s3art .rosesR{left:80.234%;top:62.799%;width:19.766%;transform-origin:80% 100%;animation:plantSway 3.2s ease-in-out infinite -1.2s;}
  .s3art .elephant{left:9.139%;top:73.385%;width:47.715%;transform-origin:50% 100%;animation:eleWalk 2.4s ease-in-out infinite;}
  .s3art .lotusL{left:0.000%;top:79.844%;width:32.412%;transform-origin:30% 100%;animation:lotusSway 3.4s ease-in-out infinite -.4s;}
  .s3art .lotusR{left:59.405%;top:79.844%;width:40.595%;transform-origin:70% 100%;animation:lotusSway 3.8s ease-in-out infinite -1.6s;}
  @keyframes stringSwing{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes bananaSwayL{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2.5deg);}}
  @keyframes eleWalk{0%,100%{transform:translateY(0) rotate(0deg);}25%{transform:translateY(-1.2%) rotate(-1deg);}50%{transform:translateY(0) rotate(0deg);}75%{transform:translateY(-1.2%) rotate(1deg);}}

  /* text starts below the hanging flowers */
  .s3-text{position:absolute;left:10%;right:10%;top:41%;text-align:center;}
  .s3-text::before{
    content:"";position:absolute;left:-14%;right:-14%;top:-8%;bottom:-8%;z-index:-1;
    background:radial-gradient(closest-side, rgba(255,250,238,.95) 0%, rgba(255,250,238,.85) 55%, rgba(255,250,238,0) 100%);
  }
  .s3-text .script,.s3-text .serif,.s3-text .italic,.s3-text .caps{text-shadow:0 0 2cqi #fffaf0, 0 0 1cqi #fffaf0;}
  .s3-please{font-size:8cqi;line-height:1.05;white-space:nowrap;}
  .s3-for{font-size:3cqi;margin-top:.6cqi;}
  .s3-title{font-family:'Great Vibes',cursive;font-size:8.6cqi;line-height:1.05;}
  .s3-date{font-size:3.7cqi;margin-top:.6cqi;white-space:nowrap;}
  .s3-date .bar{color:var(--gold);margin:0 1cqi;}
  .s3-date sup{font-size:.6em;}
  .s3-mlabel{font-size:2.2cqi;letter-spacing:.35em;margin-top:1.6cqi;color:var(--maroon);}

  /* muhurtham watch (smaller) */
  .clockbox{position:relative;width:14cqi;height:14cqi;margin:2.2cqi auto 0;}
  .rays{
    position:absolute;inset:-3.6cqi;border-radius:50%;
    background:repeating-conic-gradient(rgba(240,190,80,.55) 0 3deg, transparent 3deg 12deg);
    -webkit-mask:radial-gradient(circle, transparent 42%, #000 48%, transparent 72%);
            mask:radial-gradient(circle, transparent 42%, #000 48%, transparent 72%);
    animation:spinSlow 30s linear infinite;
  }

    date:      "2026-12-03",          // YYYY-MM-DD
    muhurtham: "6:30 AM",             // DUMMY FOR NOW
    rituals: [                        // TIMES ARE DUMMY FOR NOW  (cards go white, maroon, white, maroon...)  main: true = shows MUHURTHAM
      { icon: "🐘", time: "6:00 AM",  name: "Ganapathi Pooja",       sub: "A blessed beginning" },

    ],
    address:   "H.No 1-23, Sri Sai Nagar<br>Hyderabad, Telangana",  // DUMMY FOR NOW
    mapLink:   "",                    // paste Google Maps link here (empty = search the address)
    phones:    ["9640552020", "970530122"],

  };

  /* ---------- SPEED ---------- */
  const PACE = {
    letter:   0.035,   // small capital lines: seconds per letter
    pen:      0.075,   // cursive lines: seconds per letter (letter-by-letter writing)
    fly:      0.8,     // ritual cards

  const $ = id => document.getElementById(id);

  /* =====================================================

  $("s1Event").textContent = ORDER.eventName.toUpperCase();
  $("s2Name1").textContent = ORDER.elders[0];
  $("s2Name2").textContent = ORDER.elders[1];

  const d = new Date(ORDER.date + "T00:00:00");
  const day = d.getDate();
  const sfx = (day % 10 === 1 && day !== 11) ? "st" : (day % 10 === 2 && day !== 12) ? "nd" : (day % 10 === 3 && day !== 13) ? "rd" : "th";
  const weekName  = d.toLocaleDateString("en-IN", { weekday: "long" });
  const monthName = d.toLocaleDateString("en-IN", { month: "long" });
  $("s3Title").textContent = ORDER.title;
  $("s3Date").innerHTML = weekName + '<span class="bar">|</span>' + day + '<sup>' + sfx + '</sup>' + '<span class="bar">|</span>' + monthName + " " + d.getFullYear();

  /* ---------- Screen 2: elders photo (tries the file names one by one) ---------- */
  (function(){
    const names = ORDER.eldersPhoto, img = $("eldersImg"); let i = 0;
    img.onerror = () => { i++; if(i < names.length) img.src = names[i]; };
    img.src = names[0];
  })();

  /* ---------- Screen 3: muhurtham watch ---------- */
  function parseTime(t){
    const m = t.match(/(\d+)(?::(\d+))?\s*(AM|PM)?/i) || [];
    let h = +m[1] || 0; const mi = +m[2] || 0; const ap = (m[3] || "").toUpperCase();
    if(ap === "PM" && h < 12) h += 12;
    if(ap === "AM" && h === 12) h = 0;
    return { h, mi };
  }
  $("s3Time").textContent = ORDER.muhurtham;

  const mt = parseTime(ORDER.muhurtham);
  (function buildClock(){
    let s = '<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a2"/><stop offset=".45" stop-color="#b07b22"/><stop offset=".6" stop-color="#fff1c0"/><stop offset="1" stop-color="#9c6d22"/></linearGradient></defs>' +
            '<circle cx="50" cy="50" r="49" fill="url(#cg)"/><circle cx="50" cy="50" r="44" fill="#fffaf2"/>';
    for(let i = 0; i < 60; i++){
      const big = i % 5 === 0;
      s += '<line x1="50" y1="' + (big ? 9 : 10) + '" x2="50" y2="' + (big ? 15 : 12.5) + '" stroke="' + (big ? "#7a1f2b" : "#c9a45a") + '" stroke-width="' + (big ? 1.8 : .7) + '" transform="rotate(' + i * 6 + ' 50 50)"/>';
    }
    const hrA = ((mt.h % 12) + mt.mi / 60) * 30, minA = mt.mi * 6;
    s += '<line class="hand hr"  x1="50" y1="50" x2="50" y2="28" stroke="#7a1f2b" stroke-width="3.6" stroke-linecap="round" style="--a:' + hrA + 'deg"/>' +
         '<line class="hand min" x1="50" y1="50" x2="50" y2="17" stroke="#a0701f" stroke-width="2.2" stroke-linecap="round" style="--a:' + minA + 'deg"/>' +
         '<line class="hand sec" x1="50" y1="56" x2="50" y2="14" stroke="#d4a64a" stroke-width=".8"/>' +
         '<circle cx="50" cy="50" r="3" fill="#7a1f2b"/><circle cx="50" cy="50" r="1.2" fill="#f3d58a"/>';
    $("clock").innerHTML = s;
  })();

  /* ---------- Screen 2: lotus petals that open around the elders' photo ---------- */
  (function makeLotus(){
    const petal = (len, wid) => "M0,0 C" + wid + "," + (-len*.25) + " " + wid*0.9 + "," + (-len*.75) + " 0," + (-len) + " C" + (-wid*0.9) + "," + (-len*.75) + " " + (-wid) + "," + (-len*.25) + " 0,0 Z";
    let svg = '<defs>' +
      '<linearGradient id="pkA" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff2f4"/><stop offset=".55" stop-color="#f5a3b8"/><stop offset="1" stop-color="#d9446f"/></linearGradient>' +
      '<linearGradient id="pkB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f8c1cf"/><stop offset="1" stop-color="#e7688c"/></linearGradient>' +
      '<linearGradient id="lfG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5f9a4a"/><stop offset="1" stop-color="#2f6b34"/></linearGradient></defs>';
    const layers = [                     // [count, length, width, colour, start angle, delay]
      [8,  98, 30, "lfG", 22.5, 0.0],    // green leaves behind
      [12, 92, 26, "pkA", 0,    0.4],    // outer pink petals
      [12, 76, 24, "pkB", 15,   0.9],    // inner light petals
      [8,  60, 22, "pkA", 22.5, 1.4]     // centre petals
    ];
    layers.forEach(([n, len, wid, g, start, dl]) => {
      for(let k = 0; k < n; k++){
        const a = start + k * 360 / n;
        svg += '<g transform="rotate(' + a + ')"><path class="pt" d="' + petal(len, wid) + '" fill="url(#' + g + ')" stroke="rgba(160,40,80,.25)" stroke-width=".6" data-d="' + (dl + k * 0.03).toFixed(2) + '"/></g>';
      }
    });
    $("petalsSvg").innerHTML = svg;
  })();

  /* ---------- Screen 4: rituals timeline ---------- */
  const diyaSVG =
    '<svg viewBox="0 0 40 30"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3a2"/><stop offset="1" stop-color="#a0701f"/></linearGradient></defs>' +
    '<path class="flame" d="M20 1 C25 7 24 13 20 15 C16 13 15 7 20 1 Z" fill="#ffb627"/>' +
    '<path d="M20 6 C22 9 22 12 20 13.5 C18 12 18 9 20 6 Z" fill="#fff2b0"/>' +
    '<path d="M3 16 Q20 32 37 16 Z" fill="url(#dg)"/>' +
    '<ellipse cx="20" cy="16" rx="17" ry="2.6" fill="#f3d58a"/></svg>';

  $("tlRows").innerHTML = ORDER.rituals.map((r, i) => {
    const side = i % 2 === 0 ? "left" : "right";
    return '<div class="row ' + side + '">' +
      '<div class="diya ln pop">' + diyaSVG + '</div>' +
      '<div class="tcard ' + (i % 2 === 1 ? "main " : "") + 'ln ' + (side === "left" ? "fromL" : "fromR") + '">' +
        '<p class="tm">' + (side === "right" ? '<span class="ic">' + (r.icon || "") + '</span>' : "") +
          (r.main ? "MUHURTHAM · " : "") + r.time +
          (side === "left" ? '<span class="ic">' + (r.icon || "") + '</span>' : "") + '</p>' +
        '<p class="nm">' + r.name + '</p>' +
        (r.sub ? '<p class="sb">' + r.sub + '</p>' : '') +
      '</div></div>';
  }).join("");

  /* ---------- Screen 5: names, address, directions, phones ---------- */
  $("s6Names").textContent = ORDER.hosts.join(" & ");
  $("s6Addr").innerHTML = ORDER.address;
  const plainAddr = ORDER.address.replace(/<br\s*\/?>/gi, ", ");
  $("btnMap").href = ORDER.mapLink || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(plainAddr));
  $("s6Calls").innerHTML = "&#9742; " + ORDER.phones.map(p => '<a href="tel:' + p + '">' + p + '</a>').join(" &nbsp;·&nbsp; ");

  /* =====================================================
     SPLIT LINES INTO SINGLE LETTERS
     ===================================================== */
  function splitLetters(el){
    [...el.childNodes].forEach(node => {
      if(node.nodeType === 3){
        const frag = document.createDocumentFragment();
        [...node.textContent].forEach(c => {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c;
          frag.appendChild(s);
        });
        node.replaceWith(frag);
      } else if(node.nodeType === 1){
        splitLetters(node);
      }
    });
  }
  document.querySelectorAll(".ln.letters, .ln.write").forEach(splitLetters);

  /* =====================================================
     PLAY A SCREEN LINE BY LINE – returns total seconds
     ===================================================== */
  function playLines(screen, start){
    let t = start;
    screen.classList.remove("go"); void screen.offsetWidth;
    screen.querySelectorAll(".ln").forEach(el => {
      el.classList.remove("on");
      void el.offsetWidth;
      let dur;
      if(el.classList.contains("letters")){
        const chars = el.querySelectorAll(".ch");
        chars.forEach((c, i) => c.style.animationDelay = (t + i * PACE.letter) + "s");
        dur = chars.length * PACE.letter + 0.25;
      } else if(el.classList.contains("write")){
        const chars = el.querySelectorAll(".ch");
        el.style.setProperty("--t", t + "s");
        chars.forEach((c, i) => c.style.animationDelay = (t + i * PACE.pen) + "s");
        dur = chars.length * PACE.pen + 0.3;
      } else if(el.classList.contains("fromL") || el.classList.contains("fromR")){
        el.style.animationDelay = t + "s";
        dur = PACE.fly;
      } else if(el.classList.contains("lotusbox")){
        el.style.opacity = 1;
        el.querySelectorAll(".pt").forEach(p => p.style.animationDelay = (t + parseFloat(p.dataset.d)) + "s");
        el.style.setProperty("--pd", (t + 2.2) + "s");
        dur = 3.4;
      } else if(el.classList.contains("pop")){
        el.style.animationDelay = t + "s";
        if(el.classList.contains("clockbox")) $("clock").style.setProperty("--hd", (t + 0.5) + "s");
        dur = el.classList.contains("diya") ? PACE.diya : PACE.pop;
      } else {
        el.style.animationDelay = t + "s";
        dur = PACE.fade;
      }
      el.classList.add("on");
      t += dur;
    });
    screen.classList.add("go");
    return t;
  }

  /* =====================================================
     SCREEN CHANGING (automatic, like a video)
     ===================================================== */
  const screens = [...document.querySelectorAll(".screen")];
  const N = screens.length;
  let autoTimer, s1Started = false;

  function goToScreen(n){
    const next = $("screen" + n);
    if(!next) return;
    s1Started = true;
    screens.forEach(s => s.classList.remove("active"));
    next.classList.add("active");
    const total = playLines(next, 1.0);
    clearTimeout(autoTimer);
    if(n !== N) autoTimer = setTimeout(() => goToScreen(n + 1), (total + PACE.hold) * 1000);
  }

  /* Screen 1: picture is already moving – start the text after a moment */
  function startS1(){
    if(s1Started) return;
    s1Started = true;
    const total = playLines($("screen1"), 0);
    autoTimer = setTimeout(() => goToScreen(2), (total + PACE.hold) * 1000);
  }
  setTimeout(startS1, 1200);

  // falling marigold petals on screen 1
  (function makePetals(){
    const box = $("petals1"), colors = ["#f7a21b","#ffc93c","#f58a07","#ffd76a","#e85d8a"];
    for(let i = 0; i < 18; i++){
      const p = document.createElement("span");
      p.className = "petal";
      p.style.left = (Math.random() * 95) + "%";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (6 + Math.random() * 5) + "s";
      p.style.animationDelay = (Math.random() * 7) + "s";
      box.appendChild(p);
    }
  })();

  $("btnAgain").addEventListener("click", () => goToScreen(1));

  /* =====================================================
     MUSIC – starts on first touch anywhere, button to stop
     ===================================================== */
  const music = $("bgMusic"), musicBtn = $("musicBtn");
  music.src = ORDER.music;
  function setMusic(on){
    if(on){
      music.play().then(() => { musicBtn.classList.add("playing"); musicBtn.classList.remove("off"); }).catch(()=>{});
    } else {
      music.pause();
      musicBtn.classList.remove("playing"); musicBtn.classList.add("off");
    }
  }
  setMusic(true);
  document.addEventListener("pointerdown", function first(e){
    if(e.target === musicBtn) return;
    setMusic(true);
    document.removeEventListener("pointerdown", first);
  });
  musicBtn.addEventListener("click", e => { e.stopPropagation(); setMusic(music.paused); });

  /* =====================================================
     GOLD DUST
     ===================================================== */
  const cv = $("sparkles"), ctx = cv.getContext("2d");
  let W = 0, H = 0, dots = [];
  function size(){
    const rc = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rc.width; H = rc.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", size); size();
  function floater(y){
    dots.push({ x: Math.random() * W, y, vx: (Math.random() - .5) * .15, vy: -.12 - Math.random() * .3,
                life: 400 + Math.random() * 400, r: .5 + Math.random() * 1.5, tw: Math.random() * 6 });
  }
  for(let i = 0; i < 30; i++) floater(Math.random() * H);
  function tick(){
    ctx.clearRect(0, 0, W, H);
    for(let i = dots.length - 1; i >= 0; i--){
      const p = dots[i];
      p.x += p.vx; p.y += p.vy; p.life--; p.tw += .08;
      if(p.life <= 0 || p.y < -10){ dots.splice(i, 1); floater(H + 5); continue; }
      const f = Math.min(1, p.life / 40) * (0.5 + 0.5 * Math.sin(p.tw));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, "rgba(255,246,205," + f + ")");
      g.addColorStop(.35, "rgba(240,196,92," + f * .8 + ")");
      g.addColorStop(1, "rgba(240,196,92,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
