<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a1f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gruhapravesam | Balamoni Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@500;600;700&family=Noto+Serif+Telugu:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* =====================================================
     COLOURS (same for every order)
     ===================================================== */
  :root{
    --maroon:#7a1f2b;
    --text:#5b2a22;
    --gold:#a0701f;
    --gold-light:#e9c877;
    --cream:#f6ecd2;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#1b120c;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
  body{-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;}
  body{font-family:'Cormorant Garamond',serif;color:var(--text);-webkit-tap-highlight-color:transparent;}

  /* Phone-sized frame (on laptop it stays phone width) – fixed height so it never jumps */
  .app{
    position:relative;
    width:min(100vw,480px);
    height:100vh;
    height:100svh;
    margin:0 auto;
    overflow:hidden;
    background:radial-gradient(120% 70% at 50% 50%,#fbf3df 0%,#efdcb4 100%);
    container-type:size;
  }

  /* Stage – the WHOLE invitation always fits on every phone (never cut on the sides) */
  .stage{
    position:absolute;
    left:50%;top:50%;
    width:min(112cqw, calc(100cqh * 1040 / 1860));
    aspect-ratio:1040 / 1860;
    transform:translate(-50%,-50%);
    container-type:inline-size;
    overflow:hidden;
  }

  /* Screens: soft blur cross-fade (blur fully removed once shown, so photos stay sharp) */
  .screen{
    position:absolute;inset:0;
    opacity:0;visibility:hidden;
    filter:blur(12px);
    transition:opacity 1.2s ease, filter 1.2s ease, visibility 1.2s ease;
  }
  .screen.active{opacity:1;visibility:visible;filter:none;}

  /* Gold dust on top of everything */
  #sparkles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}

  /* =====================================================
     TEXT STYLES – royal wedding look
     ===================================================== */
  .script{font-family:'Great Vibes',cursive;color:var(--maroon);line-height:1.2;}
  .serif {font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--text);line-height:1.35;}
  .italic{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--gold);}
  .caps  {font-family:'Cinzel Decorative',serif;font-weight:700;letter-spacing:.22em;color:var(--gold);}

  /* every cursive line = same bold look as "Ganesh & Bhargavi" */
  .script,.s1-names,.vibe{-webkit-text-stroke:.022em currentColor;paint-order:stroke fill;}
  #screen2 .script{-webkit-text-stroke:0;}
  #screen2 .caps{font-weight:700;}
  .vibe{font-family:'Great Vibes',cursive !important;font-style:normal !important;font-weight:400 !important;color:var(--maroon) !important;}
  .caps{font-weight:900;}

  /* Gold foil text that shines */
  .gold{
    display:inline-block;
    background:linear-gradient(100deg,
      #7c4a0c 0%, #b8841f 20%, #fff0bd 30%, #c9962f 40%, #7c4a0c 55%,
      #b8841f 70%, #fff0bd 80%, #c9962f 90%, #7c4a0c 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    padding:0 2cqi;
    animation:shine 3s linear infinite;
  }
  @keyframes shine{to{background-position:-200% 0;}}

  /* small gold ornament line */
  .orn{
    width:30cqi;height:2cqi;margin:1.2cqi auto;
    background:
      radial-gradient(circle,var(--gold) 0 .55cqi,transparent .65cqi) center/2cqi 2cqi no-repeat,
      linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold) 42%,transparent 45%,transparent 55%,var(--gold) 58%,var(--gold) 75%,transparent) center/100% 1px no-repeat;
  }

  /* =====================================================
     REVEAL EFFECTS (one by one – nothing shows before its turn)
     ===================================================== */
  .ln{opacity:0;}

  /* written left to right like a pen – letters stay joined, nothing overlaps */
  .ln.write{opacity:0;width:fit-content;margin-left:auto;margin-right:auto;padding:0 .25em;
    -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
    -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:100% 0;mask-position:100% 0;}
  .ln.write.on{opacity:1;animation:penWrite var(--d,1.5s) linear forwards var(--t,0s);}
  @keyframes penWrite{from{-webkit-mask-position:100% 0;mask-position:100% 0;}to{-webkit-mask-position:0 0;mask-position:0 0;}}

  .ln.letters{opacity:0;}
  .ln.letters.on{opacity:1;}
  .ln.letters .ch{opacity:0;display:inline-block;white-space:pre;}
  .ln.on.letters .ch{animation:chIn .55s ease forwards;}
  @keyframes chIn{
    0%  {opacity:0;filter:blur(4px);transform:translateY(.6cqi);}
    100%{opacity:1;filter:blur(0);transform:translateY(0);}
  }

  .ln.on.fade{animation:fadeUp .9s ease forwards;}
  @keyframes fadeUp{
    0%  {opacity:0;filter:blur(6px);transform:translateY(2cqi);}
    100%{opacity:1;filter:blur(0);transform:translateY(0);}
  }

  .ln.on.pop{animation:pop 1.2s cubic-bezier(.2,.9,.3,1.2) forwards;}
  @keyframes pop{
    0%  {opacity:0;transform:scale(.7);filter:blur(8px);}
    100%{opacity:1;transform:scale(1);filter:blur(0);}
  }

  /* cards fly in, crossing from left and right */
  .ln.on.fromL{animation:flyL 1s cubic-bezier(.2,.8,.25,1.1) forwards;}
  .ln.on.fromR{animation:flyR 1s cubic-bezier(.2,.8,.25,1.1) forwards;}
  @keyframes flyL{
    0%  {opacity:0;transform:translate(-60cqi,8cqi) rotate(-14deg) scale(.7);}
    100%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}
  }
  @keyframes flyR{
    0%  {opacity:0;transform:translate(60cqi,8cqi) rotate(14deg) scale(.7);}
    100%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}
  }

  /* shared moving keyframes */
  @keyframes sweep{0%{left:-60%;}60%,100%{left:140%;}}
  @keyframes haloPulse{0%,100%{opacity:.5;transform:scale(.96);}50%{opacity:1;transform:scale(1.04);}}
  @keyframes leafSway {0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
  @keyframes leafSwayR{0%,100%{transform:rotate(2.5deg);}50%{transform:rotate(-2.5deg);}}
  @keyframes plantSway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes lotusSway{0%,100%{transform:rotate(-3.5deg);}50%{transform:rotate(3.5deg);}}
  @keyframes stringSwing{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes bananaSwayL{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2.5deg);}}
  @keyframes flicker{from{transform:scale(1,1);}to{transform:scale(.88,1.12);}}
  @keyframes spinSlow{to{transform:rotate(360deg);}}

  /* backgrounds stay still (no zoom) so every screen looks steady */

  /* =====================================================
     LANGUAGE SWITCH (EN / తె) – right edge, on top
     ===================================================== */
  .lang-btn{position:absolute;z-index:70;top:calc(env(safe-area-inset-top, 0px) + 22px);right:12px;width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;
    border-radius:18px;border:1.2px solid var(--gold);background:rgba(255,250,240,.9);box-shadow:0 0 0 3px rgba(255,248,225,.5);cursor:pointer;}
  .lang-btn span{width:28px;height:26px;line-height:26px;padding:0;border-radius:14px;text-align:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:var(--maroon);transition:background .3s ease,color .3s ease;}
  .lang-btn span.tel{font-family:'Noto Serif Telugu',serif;font-size:14px;line-height:25px;}
  .lang-btn span.on{background:linear-gradient(135deg,#962f3b,#7a1f2b 55%,#5a1420);color:#fff3c4;}

  /* =====================================================
     MUSIC BUTTON (right edge, under the language switch)
     ===================================================== */
  .music-btn{
    position:absolute;z-index:70;
    top:calc(env(safe-area-inset-top, 0px) + 90px);right:12px;
    width:34px;height:34px;border-radius:50%;
    border:1.2px solid var(--gold);
    background:rgba(255,250,240,.75);
    color:var(--maroon);font-size:15px;line-height:31px;text-align:center;
    cursor:pointer;
  }
  .music-btn.playing{animation:spinSlow 6s linear infinite;}
  .music-btn.off::after{
    content:"";position:absolute;left:7px;right:7px;top:50%;
    height:1.2px;background:var(--maroon);transform:rotate(-45deg);
  }

  /* =====================================================
     SCREEN 1 – GANESHA (moving flowers + banana leaves)
     ===================================================== */
  .s1-text{position:absolute;left:8%;right:8%;top:28%;text-align:center;}
  .s1-text::before{content:"";position:absolute;left:-8%;right:-8%;top:-12%;bottom:-14%;z-index:-1;
    background:radial-gradient(closest-side, rgba(255,250,238,.96) 0%, rgba(255,250,238,.88) 60%, rgba(255,250,238,0) 100%);}
  .s1-text .script,.s1-text .italic,.s1-text .caps{text-shadow:0 0 2cqi #fffaf0, 0 0 1cqi #fffaf0;}

  .s1art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:899 / 1599;transform:translateX(-50%);}
  .s1art img{position:absolute;display:block;}
  .s1art .full{inset:0;width:100%;height:100%;}
  .s1art .bud_551{left:58.843%;top:0.000%;width:5.117%;transform-origin:50% 0%;animation:stringSwing 3.5s ease-in-out infinite -1.5s;}
  .s1art .bud_177{left:17.464%;top:0.000%;width:4.561%;transform-origin:50% 0%;animation:stringSwing 3.7s ease-in-out infinite -1.9s;}
  .s1art .bud_805{left:86.986%;top:0.000%;width:5.117%;transform-origin:50% 0%;animation:stringSwing 3.6s ease-in-out infinite -1.8s;}
  .s1art .bud_612{left:65.517%;top:0.000%;width:5.006%;transform-origin:50% 0%;animation:stringSwing 2.6s ease-in-out infinite -0.9s;}
  .s1art .bud_725{left:78.087%;top:0.000%;width:5.228%;transform-origin:50% 0%;animation:stringSwing 3.9s ease-in-out infinite -1.3s;}
  .s1art .bud_231{left:23.359%;top:0.000%;width:4.672%;transform-origin:50% 0%;animation:stringSwing 3.9s ease-in-out infinite -0.2s;}
  .s1art .bud_334{left:34.705%;top:0.000%;width:4.672%;transform-origin:50% 0%;animation:stringSwing 3.3s ease-in-out infinite -0.5s;}
  .s1art .bud_864{left:93.548%;top:0.000%;width:5.117%;transform-origin:50% 0%;animation:stringSwing 3.4s ease-in-out infinite -1.1s;}
  .s1art .bud_668{left:71.746%;top:0.000%;width:5.117%;transform-origin:50% 0%;animation:stringSwing 2.6s ease-in-out infinite -0.4s;}
  .s1art .bud_282{left:28.921%;top:0.000%;width:4.783%;transform-origin:50% 0%;animation:stringSwing 3.0s ease-in-out infinite -1.8s;}
  .s1art .jasL{left:1.335%;top:0.000%;width:5.339%;transform-origin:50% 0%;animation:jasSwing 4.0s ease-in-out infinite -0.3s;}
  .s1art .jasR{left:9.344%;top:0.000%;width:5.562%;transform-origin:50% 0%;animation:jasSwing 3.6s ease-in-out infinite -1.2s;}
  .s1art .bananaL{left:0.000%;top:13.071%;width:18.687%;transform-origin:0% 95%;animation:bananaSwayL 4s ease-in-out infinite;}
  .s1art .bananaR{left:74.750%;top:62.789%;width:12.903%;transform-origin:100% 100%;animation:bananaSwayR 3.6s ease-in-out infinite -1s;}
  @keyframes jasSwing{0%,100%{transform:rotate(-2.5deg);}50%{transform:rotate(2.5deg);}}
  @keyframes bananaSwayR{0%,100%{transform:rotate(2deg);}50%{transform:rotate(-3deg);}}

  /* soft divine glow on Ganesha */
  .s1art .glow{
    position:absolute;left:50%;top:9.5%;width:32%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(255,236,170,.75) 0%, rgba(255,214,120,.35) 35%, rgba(255,214,120,0) 70%);
    mix-blend-mode:screen;animation:glowPulse 2.8s ease-in-out infinite;pointer-events:none;
  }
  @keyframes glowPulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9);}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08);}}

  .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .petal{position:absolute;top:-4%;width:2.4cqi;height:1.8cqi;border-radius:70% 0 70% 0;opacity:0;animation:fall linear infinite;}
  @keyframes fall{
    0%  {transform:translate(0,0) rotate(0deg);opacity:0;}
    8%  {opacity:.95;}
    100%{transform:translate(10cqi,185cqi) rotate(560deg);opacity:0;}
  }
  /* OM (cursive) + mantra right under Lord Ganesha */
  .s1-top{position:absolute;left:0;right:0;top:15.2%;text-align:center;}
  .s1-om{font-family:'Great Vibes',cursive;font-weight:400;font-size:9.5cqi;line-height:1;letter-spacing:0;white-space:nowrap;color:var(--maroon);-webkit-text-stroke:.022em currentColor;paint-order:stroke fill;
    text-shadow:0 0 2cqi #fffaf0,0 0 1cqi #fffaf0;}
  .s1-mantra{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:4.8cqi;line-height:1.2;letter-spacing:.02em;white-space:nowrap;color:#7a4a0a;margin-top:.6cqi;
    text-shadow:0 0 2cqi #fffaf0,0 0 1cqi #fffaf0;}
  /* same style as "The Rituals" title */
  .s1-welcome{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:3.8cqi;letter-spacing:.03em;line-height:1.2;color:var(--maroon);margin-top:0;white-space:nowrap;text-shadow:0 0 2cqi #fffaf0,0 0 1cqi #fffaf0;}
  .s1-names{font-family:'Great Vibes',cursive;font-size:10.5cqi;line-height:1.2;white-space:nowrap;margin-top:5cqi;
    color:#7a1f2b;text-shadow:0 0 .2cqi #e9c877, 0 .3cqi .6cqi rgba(160,112,31,.45), 0 0 3cqi #fffaf0;}
  .s1-text .orn{margin:4cqi auto 3.6cqi;width:40cqi;}
  .s1-invite{text-align:center;line-height:1;}
  /* invite line: one line, bigger, on a gold ribbon with maroon text and a shine */
  .s1-invite span{position:relative;overflow:hidden;display:inline-block;white-space:nowrap;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:4.3cqi;letter-spacing:0;line-height:1.2;
    color:#6a1622;text-shadow:0 .1cqi 0 rgba(255,250,230,.8);
    padding:1.5cqi 2.8cqi 1.7cqi;border-radius:50px;
    background:linear-gradient(135deg,#f7e3a2,#d9ac4f 30%,#fff1c0 50%,#d9ac4f 72%,#f0d58a);border:1.5px solid #7a1f2b;
    box-shadow:0 0 0 .5cqi rgba(255,248,225,.9),0 0 0 .8cqi rgba(122,31,43,.5),0 1.2cqi 3cqi rgba(122,31,43,.3);}
  .s1-invite span::after{content:"";position:absolute;top:0;left:-60%;width:30%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sweep 3.5s ease-in-out infinite 1s;}
  .s1-invite i{font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;font-size:1.3em;color:#7a1f2b;padding:0 .08em;}
  .s1-event{font-size:4.4cqi;letter-spacing:.04em;color:var(--maroon);margin-top:6cqi;white-space:nowrap;}

  /* =====================================================
     SCREEN 2 – BLESSINGS (moving cows + elders' names)
     ===================================================== */
  .s2art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:893 / 1586;transform:translateX(-50%);}
  .s2art img{position:absolute;display:block;}
  .s2art .full{inset:0;width:100%;height:100%;}
  .s2art .leavesTL{left:0.000%;top:0.000%;width:24.860%;transform-origin:0% 0%;animation:leafSway 4s ease-in-out infinite;}
  .s2art .branchL{left:0.000%;top:14.565%;width:16.797%;transform-origin:0% 0%;animation:leafSway 3.4s ease-in-out infinite -1s;}
  .s2art .leavesTR{left:86.114%;top:0.000%;width:13.886%;transform-origin:100% 0%;animation:leafSwayR 4.2s ease-in-out infinite -.5s;}
  .s2art .branchR{left:77.044%;top:26.293%;width:22.956%;transform-origin:100% 0%;animation:leafSwayR 3.6s ease-in-out infinite -1.4s;}
  .s2art .plantR{left:72.228%;top:66.393%;width:24.636%;transform-origin:50% 100%;animation:plantSway 3.2s ease-in-out infinite;}
  .s2art .cowsL{left:13.774%;top:73.834%;width:33.483%;transform-origin:50% 100%;animation:cowBob 2.2s ease-in-out infinite;}
  .s2art .cowsR{left:54.983%;top:72.194%;width:39.866%;transform-origin:50% 100%;animation:cowBob 2.6s ease-in-out infinite -.8s;}
  .s2art .front{left:11.534%;top:81.148%;width:85.554%;}
  @keyframes cowBob{0%,100%{transform:rotate(-1deg) translateY(0);}50%{transform:rotate(1deg) translateY(-1.2%);}}

  .s2-head{position:absolute;left:0;right:0;top:6%;text-align:center;}
  .s2-script{font-size:7.4cqi;white-space:nowrap;}
  .s2-small{font-size:2.6cqi;letter-spacing:.3em;margin-top:3cqi;color:var(--maroon);}

  /* elders' names – the hero of this screen */
  .s2-frame{position:absolute;left:13%;right:13%;top:18.5%;height:27.5%;
    background:linear-gradient(180deg,rgba(255,252,244,.94),rgba(255,247,230,.9));
    border:1px solid #c9a24e;border-radius:2cqi;
    box-shadow:inset 0 0 0 1.2cqi rgba(255,252,244,.9), inset 0 0 0 1.45cqi rgba(201,162,78,.7), 0 2cqi 5cqi rgba(110,60,20,.18);}
  .s2-frame .cn{position:absolute;width:9cqi;height:9cqi;border:2px solid #b8862b;}
  .s2-frame .cn.tl{top:2.4cqi;left:2.4cqi;border-right:0;border-bottom:0;border-radius:2cqi 0 0 0;}
  .s2-frame .cn.tr{top:2.4cqi;right:2.4cqi;border-left:0;border-bottom:0;border-radius:0 2cqi 0 0;}
  .s2-frame .cn.bl{bottom:2.4cqi;left:2.4cqi;border-right:0;border-top:0;border-radius:0 0 0 2cqi;}
  .s2-frame .cn.br{bottom:2.4cqi;right:2.4cqi;border-left:0;border-top:0;border-radius:0 0 2cqi 0;}
  .s2-om{position:absolute;left:0;right:0;top:-5.5cqi;margin:auto;width:11cqi;height:11cqi;border-radius:50%;
    background:linear-gradient(140deg,#962f3b,#7a1f2b 55%,#5a1420);border:1.5px solid #e9c877;
    box-shadow:0 0 0 .8cqi rgba(255,250,238,.95),0 0 4cqi rgba(233,180,70,.8);
    font-size:6cqi;line-height:10.4cqi;text-align:center;color:#f3d58a;animation:omGlow 2.6s ease-in-out infinite;}
  @keyframes omGlow{0%,100%{box-shadow:0 0 0 .8cqi rgba(255,250,238,.95),0 0 2cqi rgba(233,180,70,.5);}50%{box-shadow:0 0 0 .8cqi rgba(255,250,238,.95),0 0 6cqi rgba(233,180,70,1);}}
  .s2-names{position:absolute;left:13%;right:13%;top:23.6%;text-align:center;}
  .s2-sur{font-size:2.8cqi;letter-spacing:.45em;padding-left:.45em;color:var(--gold);}
  .s2-cpl{font-family:'Great Vibes',cursive;font-size:7cqi;line-height:1.25;color:var(--maroon);white-space:nowrap;margin-top:.8cqi;
    text-shadow:0 .2cqi 0 rgba(233,200,119,.7);}
  .s2-div{display:flex;align-items:center;justify-content:center;gap:2.4cqi;margin:2.6cqi 0 2.4cqi;font-size:3.6cqi;color:#b8862b;}
  .s2-div span{width:16cqi;height:1px;background:linear-gradient(90deg,transparent,#b8862b);}
  .s2-div span:last-child{background:linear-gradient(90deg,#b8862b,transparent);}
  /* blessing petals falling on screen 2 */
  .s2-petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;}
  .s2-bless{position:absolute;left:8%;right:8%;top:48%;text-align:center;}
  .s2-bless p{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:3.8cqi;line-height:1.6;color:#6b3418;text-shadow:0 0 2cqi #fffaf0,0 0 1cqi #fffaf0;}

  /* =====================================================
     SCREEN 3 – PLEASE JOIN US (moving elephant picture)
     ===================================================== */
  .s3art{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:941 / 1672;transform:translateX(-50%);}
  .s3art img{position:absolute;display:block;}
  .s3art .full{inset:0;width:100%;height:100%;}
  .s3art .str_178{left:16.366%;top:23.026%;width:5.101%;transform-origin:50% 0%;animation:stringSwing 2.9s ease-in-out infinite -1.1s;}
  .s3art .str_232{left:22.742%;top:23.804%;width:3.826%;transform-origin:50% 0%;animation:stringSwing 3.1s ease-in-out infinite -1.2s;}

  .s6-bless .gbtn:active{transform:translateY(.5cqi);box-shadow:0 .1cqi 0 #8a6420;}

  .s6-bless .note:empty{display:none;}

  /* =====================================================
     LOCATION BUTTON (top left, on every screen) + POPUP
     ===================================================== */
  .loc-btn{
    position:absolute;z-index:70;
    top:calc(env(safe-area-inset-top, 0px) + 22px);left:12px;
    width:34px;height:34px;border-radius:50%;
    border:1.2px solid var(--gold-light);
    background:linear-gradient(135deg,#962f3b,var(--maroon) 55%,#5a1420);
    font-size:16px;line-height:32px;text-align:center;cursor:pointer;
    box-shadow:0 0 0 3px rgba(255,248,225,.75);
    animation:locPulse 2.2s ease-in-out infinite;
  }
  @keyframes locPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,248,225,.75),0 0 0 0 rgba(233,180,70,.7);}50%{box-shadow:0 0 0 3px rgba(255,248,225,.75),0 0 0 9px rgba(233,180,70,0);}}

  .loc-pop{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:0 22px;
    background:rgba(40,15,10,.55);opacity:0;visibility:hidden;transition:opacity .4s ease, visibility .4s ease;}
  .loc-pop.show{opacity:1;visibility:visible;}
  .loc-card{position:relative;width:100%;max-width:360px;text-align:center;padding:30px 20px 22px;border-radius:18px;
    background:linear-gradient(180deg,#fffaf0,#f8ecd2);border:1.5px solid #c9a24e;
    box-shadow:inset 0 0 0 6px #fffaf0, inset 0 0 0 7.5px rgba(201,162,78,.7), 0 18px 40px rgba(0,0,0,.35);
    transform:scale(.85) translateY(20px);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);}
  .loc-pop.show .loc-card{transform:scale(1) translateY(0);}
  .loc-pin{width:54px;height:54px;margin:-58px auto 6px;border-radius:50%;font-size:26px;line-height:52px;
    background:linear-gradient(140deg,#962f3b,#7a1f2b 55%,#5a1420);border:1.5px solid #e9c877;
    box-shadow:0 0 0 5px #fffaf0,0 0 18px rgba(233,180,70,.8);}
  .loc-title{font-family:'Great Vibes',cursive;font-size:36px;line-height:1.2;color:var(--maroon);}
  .loc-addr{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;line-height:1.45;color:var(--text);margin-top:8px;}
  .loc-addr b{font-family:'Cinzel',serif;font-weight:700;font-size:19px;color:var(--maroon);}
  .loc-date{font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--gold);margin-top:10px;letter-spacing:.04em;}
  .loc-card .btn{font-size:16px;letter-spacing:.08em;padding:13px 10px;margin-top:16px;}
  .loc-call{display:block;margin-top:12px;font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:var(--maroon);text-decoration:none;}
  .loc-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(160,112,31,.5);
    background:#fffaf2;color:var(--maroon);font-size:18px;line-height:30px;cursor:pointer;}

  /* letter lines in Telugu appear as one smooth fade (Telugu letters must stay joined) */
  .ln.on.letters.whole{animation:fadeUp .9s ease both;}

    if(ap === "PM" && h < 12) h += 12;

  const mt = parseTime(ORDER.muhurtham);

         '<line class="hand sec" x1="50" y1="56" x2="50" y2="14" stroke="#d4a64a" stroke-width=".8"/>' +
         '<circle cx="50" cy="50" r="3" fill="#7a1f2b"/><circle cx="50" cy="50" r="1.2" fill="#f3d58a"/>';
    $("clock").innerHTML = s;
  })();

  /* ---------- Screen 4: rituals timeline ---------- */
  const diyaSVG =
    '<svg viewBox="0 0 40 30"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3a2"/><stop offset="1" stop-color="#a0701f"/></linearGradient></defs>' +
    '<path class="flame" d="M20 1 C25 7 24 13 20 15 C16 13 15 7 20 1 Z" fill="#ffb627"/>' +
    '<path d="M20 6 C22 9 22 12 20 13.5 C18 12 18 9 20 6 Z" fill="#fff2b0"/>' +
    '<path d="M3 16 Q20 32 37 16 Z" fill="url(#dg)"/>' +
    '<ellipse cx="20" cy="16" rx="17" ry="2.6" fill="#f3d58a"/></svg>';

  function buildRituals(t){
    $("tlRows").innerHTML = ORDER.rituals.map((r, i) => {
      const side = i % 2 === 0 ? "left" : "right";
      const tx = LANG === "te" ? { time: r.te[0], name: r.te[1], sub: r.te[2] } : r;
      return '<div class="row ' + side + '">' +
        '<div class="diya ln pop">' + diyaSVG + '</div>' +
        '<div class="tcard ' + (i % 2 === 1 ? "main " : "") + 'ln ' + (side === "left" ? "fromL" : "fromR") + '">' +
          '<p class="tm">' + (side === "right" ? '<span class="ic">' + (r.icon || "") + '</span>' : "") +
            tx.time +
            (side === "left" ? '<span class="ic">' + (r.icon || "") + '</span>' : "") + '</p>' +
          (r.main ? '<p class="mu">' + t.mu + '</p>' : '') + '<p class="nm">' + tx.name + '</p>' +
          (tx.sub ? '<p class="sb">' + tx.sub + '</p>' : '') +
        '</div></div>';
    }).join("");
  }

  /* ---------- Screen 6: directions + phones ---------- */
  const plainAddr = ORDER.address.replace(/<br\s*\/?>/gi, ", ").replace(/<[^>]+>/g, "");
  $("btnMap").href = ORDER.mapLink || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(plainAddr));
  $("s6Calls").innerHTML = "&#9742; " + ORDER.phones.map(p => '<a href="tel:' + p + '">' + p + '</a>').join(" &nbsp;·&nbsp; ");

  /* =====================================================
     SPLIT CAPITAL LINES INTO SINGLE LETTERS
     ===================================================== */
  function splitLetters(el){
    [...el.childNodes].forEach(node => {
      if(node.nodeType === 3){
        const frag = document.createDocumentFragment();
        [...node.textContent].forEach(c => {
          const s = document.createElement("span");
          s.className = "ch"; s.textContent = c;
          frag.appendChild(s);
        });
        node.replaceWith(frag);
      } else if(node.nodeType === 1){
        splitLetters(node);
      }
    });
  }

  /* =====================================================
     PLAY A SCREEN LINE BY LINE – returns total seconds
     ===================================================== */
  function playLines(screen, start){
    let t = start;
    screen.classList.remove("go"); void screen.offsetWidth;
    screen.querySelectorAll(".ln").forEach(el => {
      el.classList.remove("on");
      void el.offsetWidth;
      let dur;
      if(el.classList.contains("letters") && !el.classList.contains("whole")){
        const chars = el.querySelectorAll(".ch");
        chars.forEach((c, i) => c.style.animationDelay = (t + i * PACE.letter) + "s");
        dur = chars.length * PACE.letter + 0.25;
      } else if(el.classList.contains("write")){
        const len = el.textContent.length;
        el.style.setProperty("--t", t + "s");
        el.style.setProperty("--d", (len * PACE.pen + 0.4) + "s");
        dur = len * PACE.pen + 0.3;
      } else if(el.classList.contains("fromL") || el.classList.contains("fromR")){
        el.style.animationDelay = t + "s";
        dur = PACE.fly;
      } else if(el.classList.contains("step")){
        el.style.animationDelay = t + "s";
        dur = 0.45;
      } else if(el.classList.contains("pop")){
        el.style.animationDelay = t + "s";
        if(el.classList.contains("clockbox")) $("clock").style.setProperty("--hd", (t + 0.5) + "s");
        dur = el.classList.contains("diya") ? PACE.diya : PACE.pop;
      } else {
        el.style.animationDelay = t + "s";
        dur = PACE.fade;
      }
      el.classList.add("on");
      t += dur;
    });
    screen.classList.add("go");
    return t;
  }

  /* =====================================================
     SCREEN CHANGING (automatic, like a video)
     ===================================================== */
  const screens = [...document.querySelectorAll(".screen")];
  const N = screens.length;
  let autoTimer, s1Started = false, cur = 1;

  function goToScreen(n){
    const next = $("screen" + n);

    screens.forEach(s => s.classList.remove("active"));
    next.classList.add("active");

    if(n === N) setTimeout(initScratch, 50);
    const total = playLines(next, 1.0);
    clearTimeout(autoTimer);
    if(n !== N) autoTimer = setTimeout(() => goToScreen(n + 1), (total + PACE.hold) * 1000);
  }

      p.style.animationDelay = (Math.random() * 7) + "s";

    }

  $("locCall").innerHTML = "&#9742; " + ORDER.phones[0];
  $("locCall").href = "tel:" + ORDER.phones[0];
  function openLoc(){ clearTimeout(autoTimer); $("locPop").classList.add("show"); }

    $("locPop").classList.remove("show");
    clearTimeout(autoTimer);
    if(cur !== N) autoTimer = setTimeout(() => goToScreen(cur + 1), 3000);
  }
  $("locBtn").addEventListener("click", e => { e.stopPropagation(); openLoc(); });
  $("locClose").addEventListener("click", closeLoc);
  $("locPop").addEventListener("click", e => { if(e.target === $("locPop")) closeLoc(); });

  /* =====================================================
     LANGUAGE – English / Telugu (button at the top)
     ===================================================== */
  let LANG = "en";

  const EN = {
    om: "OM", mantra: "|| Shree Ganeshaya Namaha ||", welcome: "Welcome to the World of", names: ORDER.welcome,

    s2head: "With the Blessings of", s2small: "OUR BELOVED ELDERS",

    dir: "&#128205; DIRECTIONS", again: "&#8635; WATCH AGAIN", dir2: "&#128205; GET DIRECTIONS",

    yes: "Happily attending", no: "Unable to attend", send: "&#128591; SEND BLESSINGS",
    locDate: weekName + " · " + day + "<sup>" + sfx + "</sup> " + monthName + " · " + ORDER.muhurtham,

    invite: "మీకు <i>&amp;</i> మీ కుటుంబ సభ్యులకు ఆహ్వానం", event: T2.eventName,

    s2bless: "వారి ప్రేమ &amp; ఆశీస్సులే<br>మా నూతన జీవితానికి వెలుగు",
    please: "దయచేసి విచ్చేయండి", forAus: "శుభప్రదమైన", title: T2.title,
    date: teWeek + '<span class="bar">|</span>' + day + '<span class="bar">|</span>' + teMonth + " " + d.getFullYear(),
    mu: "ముహూర్తం", time: T2.muhurtham, s4title: "కార్యక్రమాలు",
    s5title: "ఇంట్లో కలుద్దాం", love: "ప్రేమతో,", host: T2.hostLine,
    s6title: "మా కొత్త ఇల్లు", word: "సుస్వాగతం", atHome: "మా నూతన గృహం", addr: T2.address,
    dir: "&#128205; దారి చూపండి", again: "&#8635; మళ్ళీ చూడండి", dir2: "&#128205; దారి చూపండి",
    bk: "మా ఇంటిని ఆశీర్వదించండి", pName: "మీ పేరు", pMsg: "మీ ఆశీర్వాదం (ఐచ్ఛికం)",
    yes: "తప్పకుండా వస్తాం", no: "రాలేకపోతున్నాం", send: "&#128591; ఆశీస్సులు పంపండి",
    locDate: teWeek + " · " + day + " " + teMonth + " · " + T2.muhurtham,
    sc1: "✦ గీకండి ✦", sc2: "& మా ఇల్లు చూడండి",
    err: "దయచేసి మీ పేరు రాసి, ఒకటి ఎంచుకోండి.", thanks: "మీ ఆశీస్సులకు ధన్యవాదాలు! 💛"
  };
  function TXT(){ return LANG === "te" ? TE : EN; }

  function fill(){
    const t = TXT();
    document.querySelectorAll("[data-k]").forEach(el => { if(t[el.dataset.k] !== undefined) el.innerHTML = t[el.dataset.k]; });
    document.querySelectorAll("[data-kp]").forEach(el => el.placeholder = t[el.dataset.kp]);
    buildRituals(t);
    document.querySelectorAll(".ln.letters").forEach(el => {
      if(LANG === "en"){ el.classList.remove("whole"); splitLetters(el); }
      else el.classList.add("whole");
    });
    document.documentElement.lang = LANG;
  }
  function setLang(l){
    if(l === LANG) return;
    LANG = l;
    document.body.classList.toggle("te", l === "te");
    const sp = $("langBtn").querySelectorAll("span");
    sp[0].classList.toggle("on", l === "en"); sp[1].classList.toggle("on", l === "te");
    fill();
    goToScreen(cur);                         // replay the current screen in the new language
  }
  $("langBtn").addEventListener("click", e => { e.stopPropagation(); setLang(LANG === "en" ? "te" : "en"); });
  fill();

  /* =====================================================
     SCRATCH CARD – guest scratches the gold to see the new home
     ===================================================== */
  const sc = $("scratch"), sctx = sc.getContext("2d", { willReadFrequently: true });
  let scDone = false, scDown = false, scMoves = 0, scTouched = false;
  function initScratch(){
    scDone = false; scTouched = false; scMoves = 0; $("surprise").classList.remove("revealed", "touched");
    const w = sc.offsetWidth, h = sc.offsetHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if(!w || !h) return;
    sc.width = w * dpr; sc.height = h * dpr;
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.globalCompositeOperation = "source-over";
    const g = sctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#f7e3a2"); g.addColorStop(.3, "#c99a3a"); g.addColorStop(.5, "#fff1c0"); g.addColorStop(.7, "#b07b22"); g.addColorStop(1, "#f0d58a");
    sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
    for(let i = 0; i < 70; i++){            // little sparkles on the gold
      sctx.fillStyle = "rgba(255,255,255," + (Math.random() * .6) + ")";
      sctx.beginPath(); sctx.arc(Math.random() * w, Math.random() * h, Math.random() * 1.6 + .4, 0, Math.PI * 2); sctx.fill();
    }
    sctx.strokeStyle = "rgba(122,31,43,.55)"; sctx.lineWidth = 1.5; sctx.setLineDash([5, 4]);
    sctx.strokeRect(8, 8, w - 16, h - 16); sctx.setLineDash([]);
  }
  function scratchAt(e){
    if(scDone) return;
    if(!scTouched){ scTouched = true; $("surprise").classList.add("touched"); }
    const r = sc.getBoundingClientRect();
    const x = (e.clientX - r.left) * (sc.offsetWidth / r.width), y = (e.clientY - r.top) * (sc.offsetHeight / r.height);
    sctx.globalCompositeOperation = "destination-out";
    sctx.beginPath(); sctx.arc(x, y, sc.offsetWidth * .09, 0, Math.PI * 2); sctx.fill();
    if(++scMoves % 8 === 0) checkScratch();
  }
  function checkScratch(){
    if(scDone) return;
    const d = sctx.getImageData(0, 0, sc.width, sc.height).data;
    let clear = 0, total = 0;
    for(let i = 3; i < d.length; i += 64){ total++; if(d[i] === 0) clear++; }
    if(clear / total > .35 || scMoves > 140){ reveal(); }   // opens after about a third is scratched
  }
  function reveal(){ if(scDone) return; scDone = true; $("surprise").classList.add("revealed"); }
  sc.addEventListener("pointerdown", e => { scDown = true; sc.setPointerCapture(e.pointerId); scratchAt(e); });
  sc.addEventListener("pointermove", e => { if(scDown) scratchAt(e); });
  sc.addEventListener("pointerup",   () => { scDown = false; checkScratch(); });
  sc.addEventListener("dblclick", reveal);   // double-tap also opens the home
  sc.addEventListener("pointercancel", () => { scDown = false; });

  /* =====================================================
     BLESSING CARD → opens WhatsApp with the guest's blessing
     ===================================================== */
  let bAns = "";
  document.querySelectorAll(".s6-bless .yn button").forEach(b => b.addEventListener("click", () => {
    bAns = b.dataset.v;
    document.querySelectorAll(".s6-bless .yn button").forEach(x => x.classList.toggle("on", x === b));
  }));
  $("bSend").addEventListener("click", () => {
    const n = $("bName").value.trim(), m = $("bMsg").value.trim(), note = $("bNote");
    if(!n || !bAns){ note.textContent = TXT().err; return; }
    note.textContent = TXT().thanks;
    const text = "🏡 Gruhapravesam Blessings 🙏\nName: " + n + "\n" + bAns + "\n\n" + (m || ORDER.blessMsg);
    window.open("https://wa.me/" + ORDER.whatsapp + "?text=" + encodeURIComponent(text), "_blank");
  });

  /* =====================================================
     MUSIC – starts on first touch anywhere, button to stop
     ===================================================== */
  const music = $("bgMusic"), musicBtn = $("musicBtn");
  music.src = ORDER.music;
  function setMusic(on){
    if(on){
      music.play().then(() => { musicBtn.classList.add("playing"); musicBtn.classList.remove("off"); }).catch(()=>{});
    } else {
      music.pause();
      musicBtn.classList.remove("playing"); musicBtn.classList.add("off");
    }
  }
  setMusic(true);
  document.addEventListener("pointerdown", function first(e){
    if(e.target === musicBtn) return;
    setMusic(true);
    document.removeEventListener("pointerdown", first);
  });
  musicBtn.addEventListener("click", e => { e.stopPropagation(); setMusic(music.paused); });

  /* =====================================================
     GOLD DUST
     ===================================================== */
  const cv = $("sparkles"), ctx = cv.getContext("2d");
  let W = 0, H = 0, dots = [];
  function size(){
    const rc = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rc.width; H = rc.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", size); size();
  function floater(y){
    dots.push({ x: Math.random() * W, y, vx: (Math.random() - .5) * .15, vy: -.12 - Math.random() * .3,
                life: 400 + Math.random() * 400, r: .5 + Math.random() * 1.5, tw: Math.random() * 6 });
  }
  for(let i = 0; i < 30; i++) floater(Math.random() * H);
  function tick(){
    ctx.clearRect(0, 0, W, H);
    for(let i = dots.length - 1; i >= 0; i--){
      const p = dots[i];
      p.x += p.vx; p.y += p.vy; p.life--; p.tw += .08;
      if(p.life <= 0 || p.y < -10){ dots.splice(i, 1); floater(H + 5); continue; }
      const f = Math.min(1, p.life / 40) * (0.5 + 0.5 * Math.sin(p.tw));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, "rgba(255,246,205," + f + ")");
      g.addColorStop(.35, "rgba(240,196,92," + f * .8 + ")");
      g.addColorStop(1, "rgba(240,196,92,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
